version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: it-guardian-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guardian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guardian_password}
      POSTGRES_DB: ${POSTGRES_DB:-it_guardian}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guardian} -d ${POSTGRES_DB:-it_guardian}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: it-guardian-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-guardian}:${POSTGRES_PASSWORD:-guardian_password}@postgres:5432/${POSTGRES_DB:-it_guardian}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      BACKEND_DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY}
      MONITORING_INTERVAL_SECONDS: 60
      MONITORING_TIMEOUT_SECONDS: 5
      MONITORING_PING_COUNT: 4
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: it-guardian-frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  monitoring:
    build:
      context: ./monitoring
      dockerfile: Dockerfile
    container_name: it-guardian-monitoring
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-guardian}:${POSTGRES_PASSWORD:-guardian_password}@postgres:5432/${POSTGRES_DB:-it_guardian}
      MONITORING_INTERVAL_SECONDS: 60
      MONITORING_TIMEOUT_SECONDS: 5
      MONITORING_PING_COUNT: 4
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: it-guardian-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  pgdata: